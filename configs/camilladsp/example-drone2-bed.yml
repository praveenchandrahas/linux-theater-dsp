# EXAMPLE generated by scripts/set-eq.py --set=drone2 --align=bed (the set in daily use as of 2026-10-21).
# Do not edit by hand: change scripts/set-eq.py and regenerate. Copy to ~/.config/camilladsp/config.yml only for testing.
# Hardware channel order: 0=FL 1=FR 2=RL(height) 3=RR(height) 4=FC 5=LFE 6=SL 7=SR
devices:
  samplerate: 48000
  chunksize: 1024

  capture:
    type: PipeWire
    channels: 8
    node_name: camilladsp-capture
    node_description: CamillaDSP Capture

  playback:
