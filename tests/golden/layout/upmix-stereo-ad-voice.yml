# theater-profile: stereo-ad:voice
devices:
  samplerate: 48000
  chunksize: 1024

  capture:
    type: PipeWire
    channels: 8
    node_name: camilladsp-capture
    node_description: CamillaDSP Capture

  playback:
    type: PipeWire
    channels: 8
    node_name: camilladsp-playback
    node_description: CamillaDSP Playback

filters:
  q20_1:
    type: Biquad
    parameters: {type: Peaking, freq: 47.06, gain: -10.26, q: 5.0}
  q20_2:
    type: Biquad
    parameters: {type: Peaking, freq: 60.66, gain: -2.51, q: 5.0}
  q20_3:
    type: Biquad
    parameters: {type: Peaking, freq: 85.3, gain: -4.87, q: 5.0}
  q20_4:
    type: Biquad
    parameters: {type: Peaking, freq: 107.09, gain: -4.06, q: 5.0}
  q20_5:
    type: Biquad
    parameters: {type: Peaking, freq: 142.27, gain: -1.82, q: 5.0}
  q20_6:
    type: Biquad
    parameters: {type: Peaking, freq: 154.88, gain: -5.44, q: 4.99}
  q20_7:
    type: Biquad
    parameters: {type: Peaking, freq: 176.64, gain: -3.97, q: 5.0}
  q20_8:
    type: Biquad
    parameters: {type: Peaking, freq: 250.37, gain: -5.01, q: 5.0}
  d2_1:
    type: Biquad
    parameters: {type: Peaking, freq: 72.0, gain: -6.0, q: 8.0}
  d2_2:
    type: Biquad
    parameters: {type: Peaking, freq: 84.0, gain: -6.0, q: 4.0}
  up_hp_m:
    type: BiquadCombo
    parameters: {type: ButterworthHighpass, freq: 150.0, order: 2}
  up_s_hp:
    type: BiquadCombo
    parameters: {type: ButterworthHighpass, freq: 200.0, order: 2}
  up_s_lp:
    type: BiquadCombo
    parameters: {type: ButterworthLowpass, freq: 9000.0, order: 2}
  up_h_hp:
    type: BiquadCombo
    parameters: {type: ButterworthHighpass, freq: 300.0, order: 2}
  up_dec_sl:
    type: Conv
    parameters: {type: Raw, filename: "/GOLDEN-IR/decor_sl.f32", format: F32_LE}
  up_dec_sr:
    type: Conv
    parameters: {type: Raw, filename: "/GOLDEN-IR/decor_sr.f32", format: F32_LE}
  up_dec_tl:
    type: Conv
    parameters: {type: Raw, filename: "/GOLDEN-IR/decor_tl.f32", format: F32_LE}
  up_dec_tr:
    type: Conv
    parameters: {type: Raw, filename: "/GOLDEN-IR/decor_tr.f32", format: F32_LE}
  up_dly_sl:
    type: Delay
    parameters: {delay: 0.0, unit: ms, subsample: false}
  up_dly_sr:
    type: Delay
    parameters: {delay: 2.0, unit: ms, subsample: false}
  up_dly_tl:
    type: Delay
    parameters: {delay: 2.0, unit: ms, subsample: false}
  up_dly_tr:
    type: Delay
    parameters: {delay: 5.0, unit: ms, subsample: false}
  h_hp_2:
    type: BiquadCombo
    parameters: {type: LinkwitzRileyHighpass, freq: 140, order: 4}
  h_hp_3:
    type: BiquadCombo
    parameters: {type: LinkwitzRileyHighpass, freq: 140, order: 4}
  h_lp_bus:
    type: BiquadCombo
    parameters: {type: LinkwitzRileyLowpass, freq: 140, order: 4}
  ht_310:
    type: Biquad
    parameters: {type: Peaking, freq: 310, gain: -7.5, q: 1.0}
  ht_1700:
    type: Biquad
    parameters: {type: Peaking, freq: 1700, gain: -7.0, q: 2.5}
  ht_hs:
    type: Biquad
    parameters: {type: Highshelf, freq: 6000, gain: 2.5, q: 0.8}
  ht_trim:
    type: Gain
    parameters: {gain: 1.0, inverted: false, mute: false}
  al_delay_0:
    type: Delay
    parameters: {delay: 0.2, unit: ms, subsample: false}
  al_gain_1:
    type: Gain
    parameters: {gain: -1.9, inverted: false, mute: false}
  al_delay_2:
    type: Delay
    parameters: {delay: 4.6, unit: ms, subsample: false}
  al_gain_2:
    type: Gain
    parameters: {gain: -0.6, inverted: false, mute: false}
  al_delay_3:
    type: Delay
    parameters: {delay: 4.7, unit: ms, subsample: false}
  al_gain_3:
    type: Gain
    parameters: {gain: -0.3, inverted: false, mute: false}
  al_delay_4:
    type: Delay
    parameters: {delay: 0.97, unit: ms, subsample: false}
  al_gain_4:
    type: Gain
    parameters: {gain: -0.8, inverted: false, mute: false}
  al_delay_5:
    type: Delay
    parameters: {delay: 0.2, unit: ms, subsample: false}
  al_delay_6:
    type: Delay
    parameters: {delay: 3.0, unit: ms, subsample: false}
  al_gain_6:
    type: Gain
    parameters: {gain: -4.4, inverted: false, mute: false}
  al_delay_7:
    type: Delay
    parameters: {delay: 2.72, unit: ms, subsample: false}
  al_gain_7:
    type: Gain
    parameters: {gain: -0.7, inverted: false, mute: false}

mixers:
  up_in:
    channels: {in: 8, out: 8}
    mapping:
      - dest: 0
        sources:
          - {channel: 0, gain: 1.000000, scale: linear}
      - dest: 1
        sources:
          - {channel: 1, gain: 1.000000, scale: linear}
      - dest: 2
        sources:
          - {channel: 2, gain: 0.251189, scale: linear}
      - dest: 3
        sources:
          - {channel: 3, gain: 0.251189, scale: linear}
      - dest: 4
        sources:
          - {channel: 0, gain: 0.500000, scale: linear}
          - {channel: 1, gain: 0.500000, scale: linear}
      - dest: 5
        sources: []
      - dest: 6
        sources:
          - {channel: 6, gain: 0.398107, scale: linear}
      - dest: 7
        sources:
          - {channel: 7, gain: 0.398107, scale: linear}
  up_out:
    channels: {in: 8, out: 8}
    mapping:
      - dest: 0
        sources:
          - {channel: 0, gain: 1.000000, scale: linear}
          - {channel: 4, gain: -0.650000, scale: linear}
      - dest: 1
        sources:
          - {channel: 1, gain: 1.000000, scale: linear}
          - {channel: 4, gain: -0.650000, scale: linear}
      - dest: 2
        sources:
          - {channel: 2, gain: 1.000000, scale: linear}
      - dest: 3
        sources:
          - {channel: 3, gain: 1.000000, scale: linear}
      - dest: 4
        sources:
          - {channel: 4, gain: 1.300000, scale: linear}
      - dest: 5
        sources: []
      - dest: 6
        sources:
          - {channel: 6, gain: 1.000000, scale: linear}
      - dest: 7
        sources:
          - {channel: 7, gain: 1.000000, scale: linear}
  heights_in:
    channels: {in: 8, out: 9}
    mapping:
      - dest: 0
        sources:
          - {channel: 0, gain: 0.0}
      - dest: 1
        sources:
          - {channel: 1, gain: 0.0}
      - dest: 2
        sources:
          - {channel: 2, gain: 0.0}
      - dest: 3
        sources:
          - {channel: 3, gain: 0.0}
      - dest: 4
        sources:
          - {channel: 4, gain: 0.0}
      - dest: 5
        sources:
          - {channel: 5, gain: 0.0}
      - dest: 6
        sources:
          - {channel: 6, gain: 0.0}
      - dest: 7
        sources:
          - {channel: 7, gain: 0.0}
      - dest: 8
        sources:
          - {channel: 2, gain: 0.0}
          - {channel: 3, gain: 0.0}
  heights_out:
    channels: {in: 9, out: 8}
    mapping:
      - dest: 0
        sources:
          - {channel: 0, gain: 0.0}
      - dest: 1
        sources:
          - {channel: 1, gain: 0.0}
      - dest: 2
        sources:
          - {channel: 2, gain: 0.0}
      - dest: 3
        sources:
          - {channel: 3, gain: 0.0}
      - dest: 4
        sources:
          - {channel: 4, gain: 0.0}
      - dest: 5
        sources:
          - {channel: 5, gain: 0.0}
          - {channel: 8, gain: 0.0}
      - dest: 6
        sources:
          - {channel: 6, gain: 0.0}
      - dest: 7
        sources:
          - {channel: 7, gain: 0.0}

pipeline:
  - type: Mixer
    name: up_in
  - type: Filter
    channels: [4]
    names:
      - up_hp_m
  - type: Filter
    channels: [6]
    names:
      - up_s_hp
      - up_s_lp
      - up_dec_sl
      - up_dly_sl
  - type: Filter
    channels: [7]
    names:
      - up_s_hp
      - up_s_lp
      - up_dec_sr
      - up_dly_sr
  - type: Filter
    channels: [2]
    names:
      - up_h_hp
      - up_dec_tl
      - up_dly_tl
  - type: Filter
    channels: [3]
    names:
      - up_h_hp
      - up_dec_tr
      - up_dly_tr
  - type: Mixer
    name: up_out
  - type: Mixer
    name: heights_in
  - type: Filter
    channels: [8]
    names:
      - h_lp_bus
  - type: Filter
    channels: [2]
    names:
      - h_hp_2
      - ht_310
      - ht_1700
      - ht_hs
      - ht_trim
  - type: Filter
    channels: [3]
    names:
      - h_hp_3
      - ht_310
      - ht_1700
      - ht_hs
      - ht_trim
  - type: Mixer
    name: heights_out
  - type: Filter
    channels: [0, 1, 4, 5, 6, 7]
    names:
      - q20_1
      - q20_2
      - q20_3
      - q20_4
      - q20_5
      - q20_6
      - q20_7
      - q20_8
      - d2_1
      - d2_2
  - type: Filter
    channels: [0]
    names:
      - al_delay_0
  - type: Filter
    channels: [1]
    names:
      - al_gain_1
  - type: Filter
    channels: [2]
    names:
      - al_delay_2
      - al_gain_2
  - type: Filter
    channels: [3]
    names:
      - al_delay_3
      - al_gain_3
  - type: Filter
    channels: [4]
    names:
      - al_delay_4
      - al_gain_4
  - type: Filter
    channels: [5]
    names:
      - al_delay_5
  - type: Filter
    channels: [6]
    names:
      - al_delay_6
      - al_gain_6
  - type: Filter
    channels: [7]
    names:
      - al_delay_7
      - al_gain_7
