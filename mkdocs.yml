site_name: linux-theater-dsp
site_description: >-
  Stereo and 5.1 upmixer (to 5.1.2, with ceiling channels), PipeWire routing and a CamillaDSP
  room-correction profile generator for a Linux software-defined home theatre.
repo_url: https://github.com/praveenchandrahas/linux-theater-dsp
repo_name: praveenchandrahas/linux-theater-dsp
docs_dir: docs
theme:
  name: material
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: black
      toggle: {icon: material/brightness-7, name: Switch to dark mode}
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: black
      toggle: {icon: material/brightness-4, name: Switch to light mode}
  features: [navigation.instant, navigation.sections, navigation.top, toc.integrate, content.code.copy]
markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - tables
  - toc:
      permalink: true
nav:
  - Home: index.md
  - Install: install.md
  - Usage: usage.md
  - Configuration: configuration.md
  - Design notes: design-notes.md
